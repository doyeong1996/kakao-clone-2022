<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="screenshots/kakao-logo2.jpg" />
    <link rel="stylesheet" href="css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>More</title>
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <!-- 스타투스바 -->
    <div class="status-bar">
      <div class="status-bar__column">
        <span>No Service</span>
        <i class="fa-solid fa-wifi"></i>
        <!-- Wifi Icon -->
      </div>
      <div class="status-bar__column">
        <span class="status-bar__time">18:43</span>
      </div>
      <div class="status-bar__column">
        100%<i class="fas fa-battery-full"></i>
        <!-- Battery Icon -->
      </div>
    </div>

    <!--스크린헤더 -->
    <header class="screen-header">
      <h1 class="screen-header__title">More</h1>
      <div class="screen-header__icons">
        <span>
          <a href="#" aria-label="Search"><i class="fa-solid fa-magnifying-glass fa-lg"></i></a>
        </span>
        <span>
          <a href="#" aria-label="Music"><i class="fa-solid fa-music fa-lg"></i></a>
        </span>
        <span>
          <a href="settings.html" aria-label="Settings">
            <i class="fa-regular fa-solid fa-gear fa-lg"></i>
          </a>
          <span class="screen-header__icons-dot-more"></span>
        </span>
      </div>
    </header>
    <!-- 메인스크린 -->
    <main class="main-screen more-screen">
      <div class="user-component">
        <div class="user-component__column">
          <img
            src="screenshots/kakao-profile.jpg"
            alt="Profile picture"
            class="user-component__avatar user-component__avatar--sm"
          />
          <div class="user-component__text">
            <h4 class="user-component__title user-component__title--not-bold">
              Do yeong
            </h4>
            <h6 class="user-component__subtitle">
              +82 010-1234-5678
              <a href="#"><i class="fa-regular fa-pen-to-square"></i></a>
            </h6>
          </div>
        </div>

        <div class="user-component__column">
          <div>
            <a href="#"><i class="fa-regular fa-message fa-2x"></i></a>
          </div>
        </div>
      </div>
      <div class="icon-row">
        <div class="icon-row__icon">
          <a href="#"><i class="fa-regular fa-calendar"></i></a>
          <span>Calendar</span>
        </div>
        <div class="icon-row__icon">
          <a href="#"><i class="fa-brands fa-google-drive"></i></a>
          <span>Talk Drive</span>
        </div>
        <div class="icon-row__icon">
          <a href="#"><i class="fa-regular fa-face-smile"></i></a>
          <span>Emoticons</span>
        </div>
        <div class="icon-row__icon">
          <a href="#"><i class="fa-solid fa-paint-roller"></i></a>
          <span>Themes</span>
        </div>
        <div class="icon-row__icon">
          <a href="#"><i class="fa-solid fa-file-invoice-dollar"></i></a>
          <span>Account</span>
        </div>
        <div class="icon-row__icon">
          <a href="#"><i class="fa-regular fa-comments"></i></a>
          <span>Openchat</span>
        </div>
      </div>
      <div class="more-suggestions">
        <h4 class="more-suggestions__title">Suggestions</h4>
        <div class="more-suggestions__icons">
          <div class="more-suggestions__icon">
            <div class="more-suggestions__icon-image">
              <a href="#" aria-label="Kakao Story"><i class="fa-solid fa-quote-right"></i></a>
            </div>
            <span class="more-suggestions__icon-text">Kakao Story</span>
          </div>

          <div class="more-suggestions__icon">
            <div class="more-suggestions__icon-image">
              <a href="#" aria-label="Kakao Friends"><i class="fa-solid fa-face-smile-beam"></i></a>
            </div>
            <span class="more-suggestions__icon-text">Kakao Friends</span>
          </div>

          <div class="more-suggestions__icon">
            <div class="more-suggestions__icon-image">
              <a href="#" aria-label="Kakao Game"><i class="fa-solid fa-gamepad"></i></a>
            </div>
            <span class="more-suggestions__icon-text">Kakao Game</span>
          </div>

          <div class="more-suggestions__icon">
            <div class="more-suggestions__icon-image">
              <a href="#" aria-label="Kakao Map"><i class="fa-solid fa-map-location-dot"></i></a>
            </div>
            <span class="more-suggestions__icon-text">Kakao Map</span>
          </div>

          <div class="more-suggestions__icon">
            <div class="more-suggestions__icon-image">
              <a href="#" aria-label="Kakao Page"><i class="fa-solid fa-book-open"></i></a>
            </div>
            <span class="more-suggestions__icon-text">Kakao Page</span>
          </div>

          <div class="more-suggestions__icon">
            <div class="more-suggestions__icon-image">
              <a href="#" aria-label="Kakao Webtoon"><i class="fa-solid fa-image"></i></a>
            </div>
            <span class="more-suggestions__icon-text">Kakao Webtoon</span>
          </div>
        </div>
      </div>
    </main>

    <!--네비게이션바-->
    <nav class="nav">
      <ul class="nav__list">
        <li class="nav__btn">
          <a class="nav__link" href="friends.html" aria-label="Friends">
            <i class="fa-regular fa-user fa-2x"></i>
          </a>
        </li>
        <li class="nav__btn">
          <a class="nav__link" href="chats.html" aria-label="Chats">
            <span class="nav__notification badge">1</span>
            <i class="fa-regular fa-comment fa-2x"></i>
          </a>
        </li>
        <li class="nav__btn">
          <a class="nav__link" href="find.html" aria-label="Search">
            <i class="fa-solid fa-magnifying-glass fa-2x"></i>
          </a>
        </li>
        <li class="nav__btn">
          <a class="nav__link" href="more.html" aria-current="page" aria-label="More">
            <span class="nav__dot"></span>
            <i class="fa-solid fa-ellipsis fa-2x"></i>
          </a>
        </li>
      </ul>
    </nav>
  </body>
</html>
